<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Project Forge environment model</title>
  <desc id="desc">A Project uses local workstation runtime and optional remote logical staging and production environments bound to reusable remote targets and shared host platform infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8ea0bd"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <text x="70" y="70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f7f9fc">Project Environment Model</text>
  <text x="70" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#aebbd0">The Project owns application/environment facts; reusable workstation and target layers own machine mechanics.</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="390" y="135" width="420" height="106" rx="20" fill="#25294a" stroke="#7277c9" stroke-width="2"/>
    <text x="600" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#aaaef1">GENERATED Project</text>
    <text x="600" y="209" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">Environment bindings + app runtime facts</text>

    <rect x="95" y="330" width="300" height="190" rx="20" fill="#173c35" stroke="#3a9d82" stroke-width="2"/>
    <text x="245" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#79d9bc">LOCAL</text>
    <text x="245" y="405" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">Developer workstation</text>
    <text x="245" y="442" text-anchor="middle" font-size="15" fill="#b7ded3">Docker app container</text>
    <text x="245" y="468" text-anchor="middle" font-size="15" fill="#b7ded3">local SQLite / app data</text>
    <text x="245" y="494" text-anchor="middle" font-size="15" fill="#b7ded3">loopback exposure</text>

    <rect x="450" y="310" width="650" height="300" rx="22" fill="#20293a" stroke="#50627d" stroke-width="2"/>
    <text x="775" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#9baac2">REMOTE TARGET LAYER</text>

    <rect x="500" y="385" width="245" height="150" rx="18" fill="#3d3219" stroke="#b58b2e" stroke-width="2"/>
    <text x="622" y="423" text-anchor="middle" font-size="15" font-weight="700" fill="#e5bf65">STAGING</text>
    <text x="622" y="455" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">Docker app</text>
    <text x="622" y="484" text-anchor="middle" font-size="14" fill="#ddc98e">own runtime + data</text>
    <text x="622" y="509" text-anchor="middle" font-size="14" fill="#ddc98e">logical target binding</text>

    <rect x="805" y="385" width="245" height="150" rx="18" fill="#3b2228" stroke="#b55a6f" stroke-width="2"/>
    <text x="928" y="423" text-anchor="middle" font-size="15" font-weight="700" fill="#ed8ca2">PRODUCTION</text>
    <text x="928" y="455" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">Docker app</text>
    <text x="928" y="484" text-anchor="middle" font-size="14" fill="#ddb2bc">own runtime + data</text>
    <text x="928" y="509" text-anchor="middle" font-size="14" fill="#ddb2bc">separate authorization</text>

    <rect x="545" y="558" width="460" height="80" rx="16" fill="#273246" stroke="#5b6d89" stroke-width="2"/>
    <text x="775" y="590" text-anchor="middle" font-size="15" font-weight="700" fill="#a9b6cc">REUSABLE SHARED HOST PLATFORM</text>
    <text x="775" y="616" text-anchor="middle" font-size="14" fill="#c3ccda">Docker engine • Caddy • shared network • target access mechanics</text>
  </g>

  <g stroke="#8ea0bd" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M500 241 C420 275 330 292 275 320"/>
    <path d="M600 241 C620 285 620 320 622 375"/>
    <path d="M700 241 C850 280 915 315 928 375"/>
    <path d="M622 535 V548"/>
    <path d="M928 535 V548"/>
  </g>

  <text x="70" y="668" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#8ea0bd">Staging and Production may bind to separate targets or share a physical host; logical identity and Production gates remain distinct.</text>
</svg>

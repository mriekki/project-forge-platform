name: Prepare npm Release Branch

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact next @mriekki/project-forge version
        required: true
        type: string
      source_commit:
        description: Exact current Project Forge Platform main commit
        required: true
        type: string
      core_revision:
        description: Exact accepted Project Forge Core main revision
        required: true
        type: string
      deployment_revision:
        description: Exact accepted Project Forge Deployment main revision
        required: true
        type: string
      authentication_revision:
        description: Optional exact reviewed Authentication Kit main revision for the complete next kit
        required: false
        type: string
      feedback_revision:
        description: Optional exact reviewed Feedback Kit main revision
        required: false
        type: string
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[project-forge-release]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Forge Platform main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install package dependencies
        run: npm ci

      - name: Resolve exact preparation request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_SOURCE_COMMIT: ${{ inputs.source_commit }}
          DISPATCH_CORE_REVISION: ${{ inputs.core_revision }}
          DISPATCH_DEPLOYMENT_REVISION: ${{ inputs.deployment_revision }}
          DISPATCH_AUTHENTICATION_REVISION: ${{ inputs.authentication_revision }}
          DISPATCH_FEEDBACK_REVISION: ${{ inputs.feedback_revision }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const request = process.env.EVENT_NAME === 'workflow_dispatch'
            ? {
                version: process.env.DISPATCH_VERSION,
                sourceCommit: process.env.DISPATCH_SOURCE_COMMIT,
                coreRevision: process.env.DISPATCH_CORE_REVISION,
                deploymentRevision: process.env.DISPATCH_DEPLOYMENT_REVISION,
                authenticationRevision: process.env.DISPATCH_AUTHENTICATION_REVISION,
                feedbackRevision: process.env.DISPATCH_FEEDBACK_REVISION
              }
            : JSON.parse(event.issue?.body ?? '');

          if (!/^\d+\.\d+\.\d+$/.test(request.version ?? '')) {
            throw new Error('release request version must be semantic X.Y.Z');
          }
          for (const field of ['sourceCommit', 'coreRevision', 'deploymentRevision']) {
            if (!/^[0-9a-f]{40}$/.test(request[field] ?? '')) {
              throw new Error(`release request ${field} must be an exact lowercase 40-character SHA`);
            }
          }

          if (request.authenticationRevision &&
              !/^[0-9a-f]{40}$/.test(request.authenticationRevision)) {
            throw new Error('Authentication Kit revision must be an exact accepted lowercase commit SHA');
          }
          if (request.feedbackRevision && !/^[0-9a-f]{40}$/.test(request.feedbackRevision)) {
            throw new Error('Feedback Kit revision must be an exact accepted lowercase commit SHA');
          }

          for (const [key, value] of Object.entries({
            authentication_revision: request.authenticationRevision ?? '',
            feedback_revision: request.feedbackRevision ?? '',
            version: request.version,
            source_commit: request.sourceCommit,
            core_revision: request.coreRevision,
            deployment_revision: request.deploymentRevision
          })) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          NODE

      - name: Record owner-initiated unpublished preparation run
        if: ${{ github.event_name == 'issues' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Unpublished Project Forge preparation started: $RUN_URL. npm publication is not attempted."

      - name: Verify exact current Platform main source
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ steps.request.outputs.source_commit }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          ACTUAL="$(git rev-parse HEAD)"
          MAIN="$(git rev-parse origin/main)"
          test "$ACTUAL" = "$EXPECTED_SOURCE"
          test "$MAIN" = "$EXPECTED_SOURCE"

      - name: Refuse an already-published version
        shell: bash
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@mriekki/project-forge@${VERSION}" version >/dev/null 2>&1; then
            echo "@mriekki/project-forge@${VERSION} is already published" >&2
            exit 1
          fi

      - name: Install .NET 10 for disposable Auth candidate proof
        if: ${{ steps.request.outputs.authentication_revision != '' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Resolve protected source repositories
        id: sources
        shell: bash
        env:
          CORE_SOURCE_REPOSITORY: ${{ secrets.CORE_SOURCE_REPOSITORY }}
          DEPLOYMENT_SOURCE_REPOSITORY: ${{ secrets.DEPLOYMENT_SOURCE_REPOSITORY }}
          AUTHENTICATION_SOURCE_REPOSITORY: ${{ secrets.AUTHENTICATION_SOURCE_REPOSITORY }}
          FEEDBACK_SOURCE_REPOSITORY: ${{ secrets.FEEDBACK_SOURCE_REPOSITORY }}
          AUTH_REVISION: ${{ steps.request.outputs.authentication_revision }}
          FEEDBACK_REVISION: ${{ steps.request.outputs.feedback_revision }}
        run: |
          set -euo pipefail
          check_mapping() {
            local name="$1" value="$2"
            if [[ ! "$value" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "Missing or invalid protected source repository mapping: $name" >&2
              exit 1
            fi
            echo "::add-mask::$value"
          }
          check_mapping CORE_SOURCE_REPOSITORY "$CORE_SOURCE_REPOSITORY"
          check_mapping DEPLOYMENT_SOURCE_REPOSITORY "$DEPLOYMENT_SOURCE_REPOSITORY"
          echo "core=$CORE_SOURCE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "deployment=$DEPLOYMENT_SOURCE_REPOSITORY" >> "$GITHUB_OUTPUT"
          if [[ -n "$AUTH_REVISION" ]]; then
            check_mapping AUTHENTICATION_SOURCE_REPOSITORY "$AUTHENTICATION_SOURCE_REPOSITORY"
            echo "authentication=$AUTHENTICATION_SOURCE_REPOSITORY" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$FEEDBACK_REVISION" ]]; then
            check_mapping FEEDBACK_SOURCE_REPOSITORY "$FEEDBACK_SOURCE_REPOSITORY"
            echo "feedback=$FEEDBACK_SOURCE_REPOSITORY" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout accepted Core main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.sources.outputs.core }}
          ref: main
          path: .release-sources/core
          token: ${{ secrets.PROJECT_FORGE_SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout accepted Deployment main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.sources.outputs.deployment }}
          ref: main
          path: .release-sources/deployment
          token: ${{ secrets.PROJECT_FORGE_SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout accepted Authentication Kit main (only for requested complete release)
        if: ${{ steps.request.outputs.authentication_revision != '' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.sources.outputs.authentication }}
          ref: main
          path: .release-sources/authentication
          token: ${{ secrets.PROJECT_FORGE_SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout accepted Feedback Kit main
        if: ${{ steps.request.outputs.feedback_revision != '' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.sources.outputs.feedback }}
          ref: main
          path: .release-sources/feedback
          token: ${{ secrets.PROJECT_FORGE_SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact component main revisions
        shell: bash
        env:
          CORE_REVISION: ${{ steps.request.outputs.core_revision }}
          DEPLOYMENT_REVISION: ${{ steps.request.outputs.deployment_revision }}
          AUTHENTICATION_REVISION: ${{ steps.request.outputs.authentication_revision }}
          FEEDBACK_REVISION: ${{ steps.request.outputs.feedback_revision }}
        run: |
          set -euo pipefail

          verify_checkout() {
            local root="$1"
            local expected="$2"
            local actual
            local main
            actual="$(git -C "$root" rev-parse HEAD)"
            git -C "$root" fetch --quiet origin main
            main="$(git -C "$root" rev-parse origin/main)"
            test "$actual" = "$expected"
            test "$main" = "$expected"
            test -z "$(git -C "$root" status --porcelain --untracked-files=no)"
          }

          verify_checkout .release-sources/core "$CORE_REVISION"
          verify_checkout .release-sources/deployment "$DEPLOYMENT_REVISION"
          if [[ -n "$AUTHENTICATION_REVISION" ]]; then
            verify_checkout .release-sources/authentication "$AUTHENTICATION_REVISION"
          fi
          if [[ -n "$FEEDBACK_REVISION" ]]; then
            verify_checkout .release-sources/feedback "$FEEDBACK_REVISION"
          fi

      - name: Setup Python for canonical and assembled recovery safety tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Verify exact Deployment recovery safety before package preparation
        shell: bash
        env:
          PYTHONPATH: .release-sources/deployment/src
        run: |
          set -euo pipefail
          python -m unittest discover -s .release-sources/deployment/tests -p 'test_auth_recovery_lifecycle.py' -v
          python -m unittest discover -s .release-sources/deployment/tests -p 'test_auth_recovery_retention.py' -v

      - name: Create isolated release branch
        id: branch
        shell: bash
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/project-forge-${VERSION}"
          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "Release branch already exists: ${BRANCH}" >&2
            exit 1
          fi
          git switch -c "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Prepare deterministic package metadata and descriptors
        shell: bash
        env:
          VERSION: ${{ steps.request.outputs.version }}
          AUTHENTICATION_REVISION: ${{ steps.request.outputs.authentication_revision }}
          PROJECT_FORGE_AUTH_SOURCE_REPOSITORY: ${{ steps.sources.outputs.authentication }}
          FEEDBACK_REVISION: ${{ steps.request.outputs.feedback_revision }}
          PROJECT_FORGE_FEEDBACK_SOURCE_REPOSITORY: ${{ steps.sources.outputs.feedback }}
        run: |
          set -euo pipefail
          args=(--version "$VERSION"
            --core-root .release-sources/core
            --deployment-root .release-sources/deployment)
          if [[ -n "$AUTHENTICATION_REVISION" ]]; then
            args+=(--authentication-root .release-sources/authentication)
          fi
          if [[ -n "$FEEDBACK_REVISION" ]]; then
            args+=(--feedback-root .release-sources/feedback)
          fi
          node scripts/prepare-package-update.mjs "${args[@]}"

      - name: Assemble and verify exact package assets
        shell: bash
        env:
          AUTHENTICATION_REVISION: ${{ steps.request.outputs.authentication_revision }}
          FEEDBACK_REVISION: ${{ steps.request.outputs.feedback_revision }}
        run: |
          set -euo pipefail
          args=(--core-root .release-sources/core --deployment-root .release-sources/deployment)
          if [[ -n "$AUTHENTICATION_REVISION" ]]; then
            args+=(--authentication-root .release-sources/authentication)
          fi
          if [[ -n "$FEEDBACK_REVISION" ]]; then
            args+=(--feedback-root .release-sources/feedback)
          fi
          node scripts/assemble-assets.mjs "${args[@]}"
          node scripts/verify-assets.mjs
          # Run Platform-owned tests against the exact assembled Deployment
          # code, never an installed package or the consumer workspace.
          PROJECT_FORGE_PACKAGED_DEPLOYMENT_ROOT=assets/generated/deployment/src \
          PYTHONPATH=assets/generated/deployment/src \
            python -m unittest discover -s test/fixtures \
              -p 'test_packaged_deployment_recovery_safety.py' -v
          npm test
          git diff --check

      - name: Qualify real unpublished Auth candidate in a disposable Project
        if: ${{ steps.request.outputs.authentication_revision != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qualify-auth-candidate.py \
            --package-root . \
            --authentication-root .release-sources/authentication

      - name: Verify preparation diff scope
        shell: bash
        run: |
          if [ -f assets/authentication/distribution.json ]; then
            git add -N assets/authentication/distribution.json
          fi
          if [ -f assets/feedback/distribution.json ]; then
            git add -N assets/feedback/distribution.json
          fi
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';

          const changed = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' })
            .trim()
            .split(/\r?\n/)
            .filter(Boolean);
          if (!changed.length) throw new Error('release preparation produced no changes');

          const exact = new Set([
            'package.json',
            'package-lock.json',
            'assets/components.json',
            'assets/core/distribution.json',
            'assets/deployment/distribution.json',
            'assets/authentication/distribution.json',
            'assets/feedback/distribution.json'
          ]);
          const unexpected = changed.filter((file) => !exact.has(file));
          if (unexpected.length) {
            throw new Error(`unexpected release-preparation paths: ${unexpected.join(', ')}`);
          }
          NODE

      - name: Commit and push prepared release branch
        shell: bash
        env:
          VERSION: ${{ steps.request.outputs.version }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json assets/components.json assets/core/distribution.json assets/deployment/distribution.json
          if [ -f assets/authentication/distribution.json ]; then
            git add assets/authentication/distribution.json
          fi
          if [ -f assets/feedback/distribution.json ]; then
            git add assets/feedback/distribution.json
          fi
          git commit -m "Prepare Project Forge ${VERSION}"
          git push origin "HEAD:refs/heads/${BRANCH}"

      - name: Report failed preparation with a durable run link
        if: ${{ failure() && github.event_name == 'issues' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "BLOCKED: unpublished Project Forge preparation failed; no npm package was published. Inspect the failed job: $RUN_URL"

      - name: Record cloud preparation result
        shell: bash
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          VERSION: ${{ steps.request.outputs.version }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "### Cloud release preparation ready"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Branch: \`${BRANCH}\`"
            echo "- Publication: not authorized or attempted"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ github.event_name }}" = "issues" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "Cloud release preparation ready on branch \`${BRANCH}\`. Publication was not authorized or attempted."
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi

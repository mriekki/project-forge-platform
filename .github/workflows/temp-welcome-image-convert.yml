name: Temporary welcome image conversion

on:
  push:
    branches:
      - fix/welcome-infographic-image-rendering-v2

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==12.0.0
      - name: Recover approved artwork into RGB PNG
        run: |
          python - <<'PY'
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          src = 'docs/images/project-forge-welcome.jpg'
          dst = 'project-forge-welcome.png'
          with Image.open(src) as image:
              print(f'source format={image.format} mode={image.mode} size={image.size}')
              image.convert('RGB').save(dst, format='PNG', optimize=True)
          with Image.open(dst) as image:
              print(f'output format={image.format} mode={image.mode} size={image.size}')
              assert image.format == 'PNG'
              assert image.mode == 'RGB'
          PY
      - name: Upload converted image
        uses: actions/upload-artifact@v6
        with:
          name: project-forge-welcome-png
          path: project-forge-welcome.png
          if-no-files-found: error

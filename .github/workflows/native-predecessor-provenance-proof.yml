name: Native Predecessor Provenance Proof (READ ONLY)

on:
  pull_request:
    paths:
      - 'scripts/verify-native-publication-provenance.mjs'
      - 'scripts/strict-json.mjs'
      - '.github/workflows/native-predecessor-provenance-proof.yml'

permissions:
  contents: read
  actions: read

jobs:
  exact-predecessor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.5'
          package-manager-cache: false
      - name: Fetch exact already-published package and pinned public verifier
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm view npm@11.21.0 dist.integrity --registry=https://registry.npmjs.org/)" = 'sha512-Zov8KhamNneiLdELtj5YALtNmJW4L4fCLTzjfpzXG2w6MSHcf0UxgdlK5uloCuksWT+7mGUU7wi79cO6RqivPg=='
          curl --fail --silent --show-error --max-time 60 --proto '=https' https://registry.npmjs.org/npm/-/npm-11.21.0.tgz > "$RUNNER_TEMP/npm-publisher.tgz"
          node -e 'const fs=require("fs"),c=require("crypto");const b=fs.readFileSync(process.argv[1]);if("sha512-"+c.createHash("sha512").update(b).digest("base64")!=="sha512-Zov8KhamNneiLdELtj5YALtNmJW4L4fCLTzjfpzXG2w6MSHcf0UxgdlK5uloCuksWT+7mGUU7wi79cO6RqivPg==")process.exit(2)' "$RUNNER_TEMP/npm-publisher.tgz"
          mkdir "$RUNNER_TEMP/pinned-npm-test"
          tar -xzf "$RUNNER_TEMP/npm-publisher.tgz" -C "$RUNNER_TEMP/pinned-npm-test" --no-same-owner --no-same-permissions
          test "$(node "$RUNNER_TEMP/pinned-npm-test/package/bin/npm-cli.js" --version)" = 11.21.0
          npm install --prefix "$RUNNER_TEMP/pf-signature-client" npm@11.21.0 --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          test "$(node "$RUNNER_TEMP/pf-signature-client/node_modules/npm/bin/npm-cli.js" --version)" = 11.21.0
          mkdir "$RUNNER_TEMP/neutral"
          cd "$RUNNER_TEMP/neutral"
          npm view @mriekki/project-forge@4.36.0 --json --registry=https://registry.npmjs.org/ > registry.json
          npm view @mriekki/project-forge time --json --registry=https://registry.npmjs.org/ > times.json
          npm pack @mriekki/project-forge@4.36.0 --ignore-scripts --json --registry=https://registry.npmjs.org/ > pack.json
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact @mriekki/project-forge@4.36.0 --registry=https://registry.npmjs.org/
          node "$RUNNER_TEMP/pf-signature-client/node_modules/npm/bin/npm-cli.js" audit signatures --registry=https://registry.npmjs.org/
      - name: Verify actual signed predecessor and exact historical publication run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/verify-native-publication-provenance.mjs \
            release/receipts/4.36.0.json "$RUNNER_TEMP/neutral/registry.json" \
            "$RUNNER_TEMP/neutral/mriekki-project-forge-4.36.0.tgz" "$RUNNER_TEMP/neutral/times.json" \
            "$RUNNER_TEMP/neutral/package-lock.json" "$RUNNER_TEMP/pf-signature-client/node_modules/npm"
          echo 'RELEASE_AUTHORIZED=false NPM_PUBLISHED=false PRODUCTION_CHANGED=false'

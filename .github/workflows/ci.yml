name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Cancel only superseded checks of this PR; preserve every post-merge main run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20'
          - '22'
          - '24'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check pinned npm 11 successor publisher configuration (NO PUBLISH)
        if: matrix.node == '22'
        shell: bash
        run: bash test/native-successor-pinned-publisher-npm11.sh
      - name: Verify byte-exact 4.36.1 release mirror (NO PUBLISH)
        if: matrix.node == '22'
        shell: bash
        run: bash test/native-successor-mirror-4361.sh

  required:
    name: required
    if: ${{ always() }}
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete CI matrix
        shell: bash
        run: test "${{ needs.test.result }}" = "success"

  diagnose-native-release-variable:
    # Disposable read-only PR probe. Never merge this diagnostic into main.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Show exact repo-variable comparison only (never reveal raw value)
        env:
          RELEASE_VAR_PRESENT: ${{ vars.PF_NATIVE_SUCCESSOR_PUBLISH_ENABLED != '' }}
          RELEASE_VAR_EXACT_TRUE: ${{ vars.PF_NATIVE_SUCCESSOR_PUBLISH_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "PF_NATIVE_SUCCESSOR_PUBLISH_ENABLED_PRESENT=$RELEASE_VAR_PRESENT"
          echo "PF_NATIVE_SUCCESSOR_PUBLISH_ENABLED_EXACT_TRUE=$RELEASE_VAR_EXACT_TRUE"
          test "$RELEASE_VAR_EXACT_TRUE" = 'true'

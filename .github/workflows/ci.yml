name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Cancel only superseded checks of this PR; preserve every post-merge main run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20'
          - '22'
          - '24'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: ${{ matrix.node == '22' && '0' || '1' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Reject malformed new native release selections before merge (NO PUBLISH)
        if: matrix.node == '22' && github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate-native-selection-pr.mjs
      - name: Check pinned npm 11 successor publisher configuration (NO PUBLISH)
        if: matrix.node == '22'
        shell: bash
        run: bash test/native-successor-pinned-publisher-npm11.sh
      - name: Verify byte-exact 4.36.2 qualified public mirror (NO PUBLISH)
        if: matrix.node == '22'
        shell: bash
        run: bash test/native-successor-mirror-4362.sh
      - name: Verify exact 4.36.2 publisher readiness without claims or secrets (NO PUBLISH)
        if: matrix.node == '22' && github.event_name == 'pull_request'
        shell: bash
        env:
          RELEASE_FLAG_EXACT_TRUE: ${{ vars.PF_NATIVE_SUCCESSOR_PUBLISH_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          echo "PF_NATIVE_SUCCESSOR_PUBLISH_ENABLED_EXACT_TRUE=$RELEASE_FLAG_EXACT_TRUE"
          test "$RELEASE_FLAG_EXACT_TRUE" = 'true'
          status="$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' 'https://registry.npmjs.org/@mriekki%2fproject-forge/4.36.2')"
          echo "NPM_4_36_2_TARGET_HTTP_STATUS=$status"
          test "$status" = '404'
          npm view @mriekki/project-forge dist-tags --json --registry=https://registry.npmjs.org/ > "$RUNNER_TEMP/pf-native-prior-dist-tags.json"
          node - "$RUNNER_TEMP/pf-native-prior-dist-tags.json" <<'NODE'
          const fs = require('node:fs');
          const tags = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (tags.latest !== '4.36.0') process.exit(2);
          console.log('PASS registry latest remains signed predecessor 4.36.0 (NO PUBLISH)');
          NODE

  required:
    name: required
    if: ${{ always() }}
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete CI matrix
        shell: bash
        run: test "${{ needs.test.result }}" = "success"

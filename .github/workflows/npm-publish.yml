name: Publish npm Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact @mriekki/project-forge version to publish
        required: true
        type: string
      source_commit:
        description: Exact Project Forge Platform main commit authorized for publication
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: npm-production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Forge Platform
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify authorized Project Forge Platform source
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          if [ "$ACTUAL_COMMIT" != "${{ inputs.source_commit }}" ]; then
            echo "Authorized source mismatch: expected ${{ inputs.source_commit }}, got $ACTUAL_COMMIT" >&2
            exit 1
          fi
          ACTUAL_VERSION="$(node -p "require('./package.json').version")"
          if [ "$ACTUAL_VERSION" != "${{ inputs.version }}" ]; then
            echo "Authorized version mismatch: expected ${{ inputs.version }}, got $ACTUAL_VERSION" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use pinned npm with trusted publishing support
        run: npm install --global npm@11.21.0

      - name: Install package dependencies
        run: npm ci

      - name: Refuse an already-published version
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@mriekki/project-forge@${{ inputs.version }}" version >/dev/null 2>&1; then
            echo "@mriekki/project-forge@${{ inputs.version }} is already published" >&2
            exit 1
          fi

      - name: Resolve exact component pins
        id: pins
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('assets/components.json', 'utf8'));
          if (data.schemaVersion !== 2) {
            throw new Error(`components schema mismatch: expected 2, got ${data.schemaVersion}`);
          }
          if (data.version !== process.env.EXPECTED_VERSION) {
            throw new Error(`components version mismatch: expected ${process.env.EXPECTED_VERSION}, got ${data.version}`);
          }
          for (const id of ['core', 'deployment']) {
            const revision = data.components?.[id]?.revision;
            if (typeof revision !== 'string' || !/^[0-9a-f]{40}$/.test(revision)) {
              throw new Error(`invalid ${id} revision`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${id}=${revision}\n`);
          }
          NODE
        env:
          EXPECTED_VERSION: ${{ inputs.version }}

      - name: Resolve protected source repositories
        id: sources
        shell: bash
        env:
          CORE_SOURCE_REPOSITORY: ${{ secrets.CORE_SOURCE_REPOSITORY }}
          DEPLOYMENT_SOURCE_REPOSITORY: ${{ secrets.DEPLOYMENT_SOURCE_REPOSITORY }}
        run: |
          set -euo pipefail
          for name in CORE_SOURCE_REPOSITORY DEPLOYMENT_SOURCE_REPOSITORY; do
            value="${!name:-}"
            if [[ ! "$value" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "Missing or invalid protected source repository mapping: $name" >&2
              exit 1
            fi
            echo "::add-mask::$value"
          done
          echo "core=$CORE_SOURCE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "deployment=$DEPLOYMENT_SOURCE_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Core source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.sources.outputs.core }}
          ref: ${{ steps.pins.outputs.core }}
          path: .release-sources/core
          token: ${{ secrets.PROJECT_FORGE_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Checkout exact Deployment source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.sources.outputs.deployment }}
          ref: ${{ steps.pins.outputs.deployment }}
          path: .release-sources/deployment
          token: ${{ secrets.PROJECT_FORGE_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Prepare reproducible release candidate
        run: >-
          node scripts/prepare-release.mjs
          --core-root .release-sources/core
          --deployment-root .release-sources/deployment

      - name: Verify release manifest matches authorization
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('dist/release/RELEASE_MANIFEST.json', 'utf8'));
          if (manifest.version !== process.env.EXPECTED_VERSION) {
            throw new Error(`manifest version mismatch: ${manifest.version}`);
          }
          if (manifest.sourceCommit !== process.env.EXPECTED_COMMIT) {
            throw new Error(`manifest source mismatch: ${manifest.sourceCommit}`);
          }
          NODE
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.source_commit }}

      - name: Publish exact package with npm Trusted Publishing
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(node -e "const m=require('./dist/release/RELEASE_MANIFEST.json'); process.stdout.write(m.tarball.filename)")"
          npm publish "dist/release/${TARBALL}" --access public

      - name: Verify published registry identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          EXPECTED_INTEGRITY="$(node -e "const m=require('./dist/release/RELEASE_MANIFEST.json'); process.stdout.write(m.tarball.integrity)")"
          EXPECTED_SHASUM="$(node -e "const m=require('./dist/release/RELEASE_MANIFEST.json'); process.stdout.write(m.tarball.shasum)")"
          FOUND=""
          DEADLINE=$((SECONDS + 600))
          DELAY=5
          ATTEMPT=0
          LAST_ERROR="${RUNNER_TEMP}/npm-registry-query-error.log"
          while (( SECONDS < DEADLINE )); do
            ATTEMPT=$((ATTEMPT + 1))
            if ACTUAL_VERSION="$(npm view "@mriekki/project-forge@${VERSION}" version 2>"$LAST_ERROR")"; then
              if [ "$ACTUAL_VERSION" = "$VERSION" ]; then
                FOUND=1
                break
              fi
            fi
            if (( ATTEMPT == 1 || ATTEMPT % 4 == 0 )); then
              ELAPSED=$((600 - (DEADLINE - SECONDS)))
              echo "Waiting for npm registry visibility: attempt ${ATTEMPT}, ${ELAPSED}s elapsed"
            fi
            REMAINING=$((DEADLINE - SECONDS))
            if (( REMAINING <= 0 )); then
              break
            fi
            SLEEP_FOR="$DELAY"
            if (( SLEEP_FOR > REMAINING )); then
              SLEEP_FOR="$REMAINING"
            fi
            sleep "$SLEEP_FOR"
            if (( DELAY < 30 )); then
              DELAY=$((DELAY * 2))
              if (( DELAY > 30 )); then
                DELAY=30
              fi
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "Published version did not become visible in the registry after 10 minutes" >&2
            if [ -s "$LAST_ERROR" ]; then
              echo "Last npm registry query error:" >&2
              cat "$LAST_ERROR" >&2
            fi
            exit 1
          fi
          ACTUAL_INTEGRITY="$(npm view "@mriekki/project-forge@${VERSION}" dist.integrity)"
          ACTUAL_SHASUM="$(npm view "@mriekki/project-forge@${VERSION}" dist.shasum)"
          test "$ACTUAL_INTEGRITY" = "$EXPECTED_INTEGRITY"
          test "$ACTUAL_SHASUM" = "$EXPECTED_SHASUM"

      - name: Verify public package from neutral directory
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_ROOT="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_ROOT"' EXIT
          cd "$SMOKE_ROOT"
          ACTUAL="$(npx --yes "@mriekki/project-forge@${{ inputs.version }}" version)"
          test "$ACTUAL" = "@mriekki/project-forge ${{ inputs.version }}"

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Project Forge developer environment journey</title>
  <desc id="desc">Generated Project repository progresses through clone and setup to local ready, then optionally to staging ready and production ready.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8ea0bd"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <text x="70" y="70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f7f9fc">Developer Environment Journey</text>
  <text x="70" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#aebbd0">Start local. Add remote capability only when the project needs it.</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="70" y="180" width="205" height="128" rx="18" fill="#1e2a40" stroke="#405274" stroke-width="2"/>
    <text x="172" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#91a4c4">PROJECT</text>
    <text x="172" y="254" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Generated Project</text>
    <text x="172" y="282" text-anchor="middle" font-size="15" fill="#b8c5d8">clone + open workspace</text>

    <rect x="360" y="180" width="205" height="128" rx="18" fill="#1f3440" stroke="#3b7584" stroke-width="2"/>
    <text x="462" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#8bd2df">SETUP</text>
    <text x="462" y="254" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">/setup</text>
    <text x="462" y="282" text-anchor="middle" font-size="15" fill="#b9dbe1">converge this computer</text>

    <rect x="650" y="170" width="205" height="148" rx="18" fill="#173c35" stroke="#3a9d82" stroke-width="2"/>
    <text x="752" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#79d9bc">LOCAL</text>
    <text x="752" y="250" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">READY</text>
    <text x="752" y="280" text-anchor="middle" font-size="15" fill="#b7ded3">build • test • run</text>
    <text x="752" y="302" text-anchor="middle" font-size="13" fill="#89bcae">valid stopping point</text>

    <rect x="940" y="126" width="190" height="112" rx="18" fill="#3d3219" stroke="#b58b2e" stroke-width="2"/>
    <text x="1035" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#e5bf65">STAGING</text>
    <text x="1035" y="198" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">READY</text>
    <text x="1035" y="220" text-anchor="middle" font-size="13" fill="#ddc98e">optional remote capability</text>

    <rect x="940" y="292" width="190" height="112" rx="18" fill="#3b2228" stroke="#b55a6f" stroke-width="2"/>
    <text x="1035" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#ed8ca2">PRODUCTION</text>
    <text x="1035" y="364" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">READY</text>
    <text x="1035" y="386" text-anchor="middle" font-size="13" fill="#ddb2bc">deployment still explicit</text>
  </g>

  <g stroke="#8ea0bd" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M275 244 H350"/>
    <path d="M565 244 H640"/>
    <path d="M855 226 C900 226 900 182 930 182"/>
    <path d="M855 270 C900 270 900 348 930 348"/>
  </g>

  <text x="885" y="454" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#8ea0bd">Remote capabilities are additive; they do not invalidate local readiness.</text>
</svg>

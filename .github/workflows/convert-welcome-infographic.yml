name: Convert Welcome Infographic

on:
  push:
    branches:
      - fix/welcome-infographic-png

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install image tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg

      - name: Recover damaged JPEG into clean PNG
        shell: bash
        run: |
          set -euo pipefail
          file docs/images/project-forge-welcome.jpg
          ffmpeg -hide_banner -loglevel warning -err_detect ignore_err -y \
            -i docs/images/project-forge-welcome.jpg \
            -frames:v 1 \
            -vf format=rgb24 \
            docs/images/project-forge-welcome.png
          file docs/images/project-forge-welcome.png
          identify docs/images/project-forge-welcome.png
          test "$(identify -format '%wx%h %[colorspace]' docs/images/project-forge-welcome.png)" = "768x512 sRGB"

      - name: Point WELCOME at the clean PNG and strengthen regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          alt = 'Project Forge overview showing the journey from an idea through planning, GitHub repository generation, AI-assisted development, delivery, learning, and controlled deployment.'
          old_image = f'![{alt}](./docs/images/project-forge-welcome.jpg)'
          new_image = f'![{alt}](./docs/images/project-forge-welcome.png)'

          welcome_path = Path('WELCOME.md')
          welcome = welcome_path.read_text(encoding='utf-8')
          if old_image not in welcome:
              raise SystemExit('Expected current welcome JPEG reference was not found')
          welcome_path.write_text(welcome.replace(old_image, new_image, 1), encoding='utf-8')

          test_path = Path('test/onboarding-experience.test.mjs')
          test_text = test_path.read_text(encoding='utf-8')
          old_line = f"  const imageMarkdown = '![{alt}](./docs/images/project-forge-welcome.jpg)';"
          new_line = f"  const imageMarkdown = '![{alt}](./docs/images/project-forge-welcome.png)';"
          if old_line not in test_text:
              raise SystemExit('Expected current onboarding image assertion was not found')
          test_text = test_text.replace(old_line, new_line, 1)

          anchor = "  assert.doesNotMatch(welcome, /sourceProvenance/);\n});\n\n"
          binary_test = """test('welcome infographic is a structurally valid PNG with the approved dimensions', async () => {\n  const png = await readFile(new URL('../docs/images/project-forge-welcome.png', import.meta.url));\n  const signature = Buffer.from([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);\n\n  assert.deepEqual(png.subarray(0, 8), signature, 'welcome infographic must be a real PNG');\n  assert.equal(png.subarray(12, 16).toString('ascii'), 'IHDR', 'welcome infographic must start with a PNG IHDR chunk');\n  assert.equal(png.readUInt32BE(16), 768, 'welcome infographic width must remain 768px');\n  assert.equal(png.readUInt32BE(20), 512, 'welcome infographic height must remain 512px');\n  assert.ok(png.length > 100_000, 'welcome infographic must contain the full rendered artwork');\n});\n\n"""
          if binary_test not in test_text:
              if anchor not in test_text:
                  raise SystemExit('Expected insertion anchor was not found')
              test_text = test_text.replace(anchor, anchor + binary_test, 1)

          test_text = test_text.replace(
              "  assert.doesNotMatch(welcome, /project-forge-overview\\.svg/);",
              "  assert.doesNotMatch(welcome, /project-forge-overview\\.svg/);\n  assert.doesNotMatch(welcome, /project-forge-welcome\\.jpg/);",
              1,
          )
          test_path.write_text(test_text, encoding='utf-8')
          PY

          rm docs/images/project-forge-welcome.jpg
          rm .github/workflows/convert-welcome-infographic.yml

      - name: Verify repository tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          git diff --check
          git status --short

      - name: Commit clean infographic fix to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Project Forge Automation'
          git config user.email 'mriekki@users.noreply.github.com'
          git add -A
          git commit -m 'Replace corrupt welcome infographic with clean PNG'
          git push origin HEAD:fix/welcome-infographic-png

name: Transcode welcome infographic

on:
  push:
    branches:
      - fix/welcome-infographic-websafe

permissions:
  contents: write

jobs:
  transcode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/welcome-infographic-websafe

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Recover approved artwork and transcode to web-safe sRGB PNG
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          source = Path('docs/images/project-forge-welcome.jpg')
          target = Path('docs/images/project-forge-welcome.png')

          raw = source.read_bytes()
          print(f'source bytes={len(raw)} jpeg_eoi={raw.endswith(bytes.fromhex("ffd9"))}')

          # The committed JPEG is truncated. Pillow can still recover the decoded
          # pixels; save that recovered artwork into a complete, validated PNG.
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          with Image.open(source) as image:
              image.load()
              if image.size != (768, 512):
                  raise SystemExit(f'unexpected source dimensions: {image.size}')
              rgb = image.convert('RGB')
              rgb.save(target, format='PNG', optimize=True)

          with Image.open(target) as image:
              image.verify()
          with Image.open(target) as image:
              image.load()
              if image.format != 'PNG' or image.mode != 'RGB' or image.size != (768, 512):
                  raise SystemExit(f'unexpected output: format={image.format} mode={image.mode} size={image.size}')
              print(f'output format={image.format} mode={image.mode} size={image.size}')
          PY

      - name: Commit generated PNG to the fix branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/project-forge-welcome.png
          if git diff --cached --quiet; then
            echo 'PNG already up to date.'
            exit 0
          fi
          git commit -m 'Transcode welcome infographic to web-safe PNG'
          git push origin HEAD:fix/welcome-infographic-websafe

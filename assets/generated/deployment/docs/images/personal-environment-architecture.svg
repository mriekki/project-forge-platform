<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Personal Project Forge environment architecture</title>
  <desc id="desc">A developer has a private portable profile, separate workstation-local keys and trust on each computer, and remote targets reached over SSH without storing developer GitHub credentials on the target.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8ea0bd"/>
    </marker>
  </defs>
  <rect width="1200" height="700" rx="24" fill="url(#bg)"/>
  <text x="70" y="70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f7f9fc">Personal Environment Architecture</text>
  <text x="70" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#aebbd0">Portable definitions sync. Private machine identity stays on each computer.</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="365" y="135" width="470" height="130" rx="20" fill="#25294a" stroke="#7277c9" stroke-width="2"/>
    <text x="600" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="#aaaef1">PRIVATE PERSONAL PROFILE</text>
    <text x="600" y="208" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">Portable target definitions</text>
    <text x="600" y="238" text-anchor="middle" font-size="15" fill="#c6c8ea">host • user • port • stable alias • safe preferences</text>

    <rect x="110" y="340" width="390" height="190" rx="20" fill="#1c3342" stroke="#3b7f9b" stroke-width="2"/>
    <text x="305" y="381" text-anchor="middle" font-size="15" font-weight="700" fill="#8ed2eb">WORKSTATION A</text>
    <text x="305" y="415" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Windows / Mac</text>
    <text x="305" y="452" text-anchor="middle" font-size="15" fill="#bddce8">own SSH private key + trust</text>
    <text x="305" y="478" text-anchor="middle" font-size="15" fill="#bddce8">Docker + local runtime/data</text>
    <text x="305" y="504" text-anchor="middle" font-size="15" fill="#bddce8">local credential prompts/cache</text>

    <rect x="700" y="340" width="390" height="190" rx="20" fill="#1c3342" stroke="#3b7f9b" stroke-width="2"/>
    <text x="895" y="381" text-anchor="middle" font-size="15" font-weight="700" fill="#8ed2eb">WORKSTATION B</text>
    <text x="895" y="415" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">second computer</text>
    <text x="895" y="452" text-anchor="middle" font-size="15" fill="#bddce8">different SSH private key + trust</text>
    <text x="895" y="478" text-anchor="middle" font-size="15" fill="#bddce8">Docker + local runtime/data</text>
    <text x="895" y="504" text-anchor="middle" font-size="15" fill="#bddce8">same portable definitions</text>

    <rect x="365" y="585" width="470" height="82" rx="18" fill="#213825" stroke="#4a9a58" stroke-width="2"/>
    <text x="600" y="620" text-anchor="middle" font-size="15" font-weight="700" fill="#8fda9d">REMOTE TARGETS</text>
    <text x="600" y="648" text-anchor="middle" font-size="18" fill="#ffffff">Docker runtime + Project Forge platform • no developer PAT required</text>
  </g>

  <g stroke="#8ea0bd" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M505 265 C460 300 390 310 330 332"/>
    <path d="M695 265 C740 300 810 310 870 332"/>
    <path d="M305 530 C350 570 430 588 505 600"/>
    <path d="M895 530 C850 570 770 588 695 600"/>
  </g>

  <text x="84" y="578" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#8ea0bd">Verified SSH</text>
  <text x="1018" y="578" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#8ea0bd">Verified SSH</text>
</svg>

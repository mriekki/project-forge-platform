<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Project Forge lifecycle overview</title>
  <desc id="desc">A six-step visual journey from idea and discovery through repository generation, workspace setup, implementation, delivery, and deployment, with human control over meaningful decisions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="820" rx="28" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="92" rx="22" fill="url(#accent)"/>
  <text x="60" y="73" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff">PROJECT FORGE</text>
  <text x="60" y="102" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#dbeafe">Build real software · learn the engineering · keep human control</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- row 1 -->
    <g filter="url(#shadow)">
      <rect x="60" y="165" width="320" height="170" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
      <rect x="440" y="165" width="320" height="170" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
      <rect x="820" y="165" width="320" height="170" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    </g>

    <circle cx="102" cy="207" r="24" fill="#2563eb"/>
    <text x="102" y="215" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">1</text>
    <text x="140" y="207" font-size="24" font-weight="700" fill="#0f172a">IDEA</text>
    <text x="92" y="252" font-size="18" fill="#334155">Start in ChatGPT</text>
    <text x="92" y="281" font-size="18" fill="#334155">Guided discovery</text>
    <text x="92" y="310" font-size="18" fill="#334155">Users · workflows · goals</text>

    <circle cx="482" cy="207" r="24" fill="#2563eb"/>
    <text x="482" y="215" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">2</text>
    <text x="520" y="207" font-size="24" font-weight="700" fill="#0f172a">DEFINE &amp; APPROVE</text>
    <text x="472" y="252" font-size="18" fill="#334155">V1 scope + non-goals</text>
    <text x="472" y="281" font-size="18" fill="#334155">Stack + work items</text>
    <text x="472" y="310" font-size="18" fill="#334155">Human-approved decisions</text>

    <circle cx="862" cy="207" r="24" fill="#2563eb"/>
    <text x="862" y="215" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">3</text>
    <text x="900" y="207" font-size="24" font-weight="700" fill="#0f172a">GENERATE</text>
    <text x="852" y="252" font-size="18" fill="#334155">Deterministic repository</text>
    <text x="852" y="281" font-size="18" fill="#334155">Pinned provenance</text>
    <text x="852" y="310" font-size="18" fill="#334155">GitHub + CI verified</text>

    <line x1="385" y1="250" x2="425" y2="250" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="765" y1="250" x2="805" y2="250" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- row transition -->
    <path d="M 980 345 L 980 380 L 220 380 L 220 405" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <!-- row 2 -->
    <g filter="url(#shadow)">
      <rect x="60" y="420" width="320" height="170" rx="20" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
      <rect x="440" y="420" width="320" height="170" rx="20" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
      <rect x="820" y="420" width="320" height="170" rx="20" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    </g>

    <circle cx="102" cy="462" r="24" fill="#4f46e5"/>
    <text x="102" y="470" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">4</text>
    <text x="140" y="462" font-size="24" font-weight="700" fill="#0f172a">SET UP</text>
    <text x="92" y="507" font-size="18" fill="#334155">Open VS Code workspace</text>
    <text x="92" y="536" font-size="18" fill="#334155">/setup + readiness</text>
    <text x="92" y="565" font-size="18" fill="#334155">Human workspace acceptance</text>

    <circle cx="482" cy="462" r="24" fill="#4f46e5"/>
    <text x="482" y="470" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">5</text>
    <text x="520" y="462" font-size="24" font-weight="700" fill="#0f172a">BUILD &amp; DELIVER</text>
    <text x="472" y="507" font-size="18" fill="#334155">/start-work · code · test</text>
    <text x="472" y="536" font-size="18" fill="#334155">Review meaningful diff</text>
    <text x="472" y="565" font-size="18" fill="#334155">/deliver · PR · CI · merge gate</text>

    <circle cx="862" cy="462" r="24" fill="#4f46e5"/>
    <text x="862" y="470" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">6</text>
    <text x="900" y="462" font-size="24" font-weight="700" fill="#0f172a">DEPLOY WHEN READY</text>
    <text x="852" y="507" font-size="18" fill="#334155">Evidence-based support</text>
    <text x="852" y="536" font-size="18" fill="#334155">Named environments</text>
    <text x="852" y="565" font-size="18" fill="#334155">Explicit Production gate</text>

    <line x1="385" y1="505" x2="425" y2="505" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="765" y1="505" x2="805" y2="505" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="60" y="630" width="1080" height="62" rx="18" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="600" y="655" text-anchor="middle" font-size="18" font-weight="700" fill="#3730a3">AI GUIDES THE MECHANICS · DETERMINISTIC TOOLS PROTECT REPRODUCIBILITY · THE REPOSITORY OWNS PROJECT TRUTH</text>
    <text x="600" y="680" text-anchor="middle" font-size="17" fill="#4338ca">Learning is available when useful and never blocks delivery.</text>

    <rect x="60" y="715" width="1080" height="62" rx="18" fill="#0f172a"/>
    <text x="600" y="741" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">HUMAN CONTROL</text>
    <text x="600" y="765" text-anchor="middle" font-size="17" fill="#cbd5e1">material scope · meaningful diff · merge/finalize · release · Production · destructive actions</text>
  </g>
</svg>

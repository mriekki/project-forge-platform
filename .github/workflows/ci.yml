name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Cancel only superseded checks of this PR; preserve every post-merge main run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  feedback-source-access:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feat/github-feedback-distribution' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact accepted Feedback source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ secrets.FEEDBACK_SOURCE_REPOSITORY }}
          ref: 465b5c956bf4b224b96f64cf3e47318ae5f1523e
          token: ${{ secrets.PROJECT_FORGE_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = 465b5c956bf4b224b96f64cf3e47318ae5f1523e

  test:
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20'
          - '22'
          - '24'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  required:
    name: required
    if: ${{ always() }}
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete CI matrix
        shell: bash
        run: test "${{ needs.test.result }}" = "success"
